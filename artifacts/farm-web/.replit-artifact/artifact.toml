kind = "web"
previewPath = "/"
title = "PecuáriaGest"
version = "1.0.0"
id = "artifacts/farm-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23105

[services.development]
run = "pnpm --filter @workspace/farm-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/farm-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/farm-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23105"
BASE_PATH = "/"
