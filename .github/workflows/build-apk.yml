name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        working-directory: mobile-app
        run: |
          npm ci || npm install

      - name: Sync Capacitor Android
        working-directory: mobile-app
        run: |
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PecuariaGest-Campo-Debug-APK
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
