name: CI - Lint, Docker & Testes Automatizados

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: PHP Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, gd, zip, exif

      - name: Lint PHP Files
        run: |
          find src/ public/ -name "*.php" -exec php -l {} \;

  docker-and-tests:
    name: Docker Stack & Integration Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build & Subir Stack Desacoplado
        run: |
          cp .env.example .env
          docker compose up -d --build
          docker compose ps

      - name: Aguardar Inicialização do PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U pecuaria_user -d pecuaria; then
              echo "PostgreSQL está pronto!"
              break
            fi
            echo "Aguardando banco..."
            sleep 2
          done

      - name: Executar Bateria de Testes de Integração
        run: |
          node tests/test_integration.js
          node tests/test_mobile_flow.js

      - name: Coletar Logs em Caso de Falha
        if: failure()
        run: |
          docker compose logs
