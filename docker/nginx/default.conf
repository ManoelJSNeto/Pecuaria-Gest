server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Uploads persistentes de fotos e anexos (armazenados em storage/uploads)
    location ^~ /uploads/ {
        alias /var/www/html/storage/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Cache de ativos estaticos -- servidos diretamente pelo Nginx sem passar pelo PHP
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Bloqueia acesso a arquivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Front Controller -- passa todas as requisicoes para index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento PHP via PHP-FPM no servico 'app' (conteiner separado)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
